# 實驗:redundant_obs_ratio_thr 從 0.9 調小到 0.2
# 預期:local_map_cleaner 會檢查每個共視關鍵幀，算出它的觀測裡有多少比例跟其他關鍵幀重複
#       (num_redundant_obs / num_valid_obs)，只要這個比例 >= redundant_obs_ratio_thr 就會被判定
#       「多餘」而刪除。門檻從 0.9 降到 0.2 等於審核變嚴格：只要有兩成以上觀測重複就砍，
#       關鍵幀會被清得更兇、留下的關鍵幀之間空間分佈更稀疏——地圖更精簡、mapping/local BA
#       計算量下降，但可用來做 loop detection/relocalization 候選比對的關鍵幀庫也跟著變薄，
#       遇到需要密集關鍵幀支援的場景可能受影響。

# TUM RGBD monocular model for 01

#==============#
# Camera Model #
#==============#

Camera:
  name: "TUM RGBD monocular 01"
  setup: "monocular"
  model: "perspective"

  fx: 517.306408
  fy: 516.469215
  cx: 318.643040
  cy: 255.313989

  k1: 0.262383
  k2: -0.953104
  p1: -0.005358
  p2: 0.002628
  k3: 1.163314

  fps: 30.0
  cols: 640
  rows: 480

  color_order: "RGB"

#=====================#
# Tracking Parameters #
#=====================#

Preprocessing:
  min_size: 800

#================#
# ORB Parameters #
#================#

Feature:
  name: "exp_redundant_obs_ratio: redundant_obs_ratio_thr 0.9 -> 0.2"
  scale_factor: 1.2
  num_levels: 8
  ini_fast_threshold: 20
  min_fast_threshold: 7

#====================#
# Mapping Parameters #
#====================#

Mapping:
  baseline_dist_thr_ratio: 0.02
  redundant_obs_ratio_thr: 0.2
  num_covisibilities_for_landmark_generation: 20
  num_covisibilities_for_landmark_fusion: 20

#===========================#
# PangolinViewer Parameters #
#===========================#

PangolinViewer:
  keyframe_size: 0.05
  keyframe_line_width: 1
  graph_line_width: 1
  point_size: 2
  camera_size: 0.08
  camera_line_width: 3
  viewpoint_x: 0
  viewpoint_y: -0.9
  viewpoint_z: -1.9
  viewpoint_f: 400
