# 實驗:num_covisibilities_for_landmark_fusion 從 20 調小到 5
# 預期:mapping_module 每插入一個新關鍵幀後，會取它的前 N 個共視關鍵幀，檢查目前關鍵幀跟這些
#       鄰居之間有沒有「同一個實體點被拆成多個地標」的重複觀測，並融合成一個
#       (fuse_landmark_duplication)。N 從 20 降到 5，檢查範圍變小、計算變快，但漏抓到的重複
#       地標會變多，地圖會累積更多冗餘地標點；連帶影響 local BA 精度(同一個 3D 點的觀測被拆到
#       不同地標，等於部分約束沒被用上)，也會讓 redundant_obs_ratio_thr(依賴地標觀測次數計算
#       冗餘度)判斷得不準——這個參數跟 redundant_obs_ratio_thr 是連動的，見
#       exp_redundant_obs_ratio.yaml。

# TUM RGBD monocular model for 01

#==============#
# Camera Model #
#==============#

Camera:
  name: "TUM RGBD monocular 01"
  setup: "monocular"
  model: "perspective"

  fx: 517.306408
  fy: 516.469215
  cx: 318.643040
  cy: 255.313989

  k1: 0.262383
  k2: -0.953104
  p1: -0.005358
  p2: 0.002628
  k3: 1.163314

  fps: 30.0
  cols: 640
  rows: 480

  color_order: "RGB"

#=====================#
# Tracking Parameters #
#=====================#

Preprocessing:
  min_size: 800

#================#
# ORB Parameters #
#================#

Feature:
  name: "exp_num_covis_landmark_fusion: num_covisibilities_for_landmark_fusion 20 -> 5"
  scale_factor: 1.2
  num_levels: 8
  ini_fast_threshold: 20
  min_fast_threshold: 7

#====================#
# Mapping Parameters #
#====================#

Mapping:
  baseline_dist_thr_ratio: 0.02
  redundant_obs_ratio_thr: 0.9
  num_covisibilities_for_landmark_generation: 20
  num_covisibilities_for_landmark_fusion: 5

#===========================#
# PangolinViewer Parameters #
#===========================#

PangolinViewer:
  keyframe_size: 0.05
  keyframe_line_width: 1
  graph_line_width: 1
  point_size: 2
  camera_size: 0.08
  camera_line_width: 3
  viewpoint_x: 0
  viewpoint_y: -0.9
  viewpoint_z: -1.9
  viewpoint_f: 400
