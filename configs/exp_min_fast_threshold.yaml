# 實驗:min_fast_threshold 從 7 調大到 60(等於跟 ini_fast_threshold 一樣)
# 預期:orb_extractor 的補救機制是「第一輪用 ini_fast_threshold=20 找不到角點的網格，
#       再用 min_fast_threshold 降低門檻重跑一次」；把 min_fast_threshold 也調成 20，
#       等於補救時門檻跟第一輪完全相同，補救機制形同失效——低紋理網格(白牆、地板反光等)
#       原本能靠補救撿回幾個角點，現在會直接開天窗、變成 0 個特徵點。整體特徵點數量變少，
#       且分佈更集中在高紋理區域，弱紋理場景下追蹤可能因為特徵點不足直接失敗。

# TUM RGBD monocular model for 01

#==============#
# Camera Model #
#==============#

Camera:
  name: "TUM RGBD monocular 01"
  setup: "monocular"
  model: "perspective"

  fx: 517.306408
  fy: 516.469215
  cx: 318.643040
  cy: 255.313989

  k1: 0.262383
  k2: -0.953104
  p1: -0.005358
  p2: 0.002628
  k3: 1.163314

  fps: 30.0
  cols: 640
  rows: 480

  color_order: "RGB"

#=====================#
# Tracking Parameters #
#=====================#

Preprocessing:
  min_size: 800

#================#
# ORB Parameters #
#================#

Feature:
  name: "exp_min_fast_threshold: min_fast_threshold 7 -> 60 ini_fast_threshold 20 -> 60"
  scale_factor: 1.2
  num_levels: 8
  ini_fast_threshold: 60
  min_fast_threshold: 60

#====================#
# Mapping Parameters #
#====================#

Mapping:
  baseline_dist_thr_ratio: 0.02
  redundant_obs_ratio_thr: 0.9
  num_covisibilities_for_landmark_generation: 20
  num_covisibilities_for_landmark_fusion: 20

#===========================#
# PangolinViewer Parameters #
#===========================#

PangolinViewer:
  keyframe_size: 0.05
  keyframe_line_width: 1
  graph_line_width: 1
  point_size: 2
  camera_size: 0.08
  camera_line_width: 3
  viewpoint_x: 0
  viewpoint_y: -0.9
  viewpoint_z: -1.9
  viewpoint_f: 400
