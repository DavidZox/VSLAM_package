# 實驗:scale_factor 從 1.2 調大到 1.5
# 預期:每一層金字塔之間差距變大，num_levels 一樣是 8 層，但整體涵蓋的尺度範圍變廣、
#       相鄰層之間的間隔變粗——可能漏掉中間尺度的特徵，也可能讓每層計算量沒差太多但效果變差。

#==============#
# Camera Model #
#==============#

Camera:
  name: "TUM RGBD monocular 01"
  setup: "monocular"
  model: "perspective"

  fx: 517.306408
  fy: 516.469215
  cx: 318.643040
  cy: 255.313989

  k1: 0.262383
  k2: -0.953104
  p1: -0.005358
  p2: 0.002628
  k3: 1.163314

  fps: 30.0
  cols: 640
  rows: 480

  color_order: "RGB"

#=====================#
# Tracking Parameters #
#=====================#

Preprocessing:
  min_size: 800

#================#
# ORB Parameters #
#================#

Feature:
  name: "exp_scale_factor: scale_factor 1.2 -> 1.5"
  scale_factor: 1.5
  num_levels: 8
  ini_fast_threshold: 20
  min_fast_threshold: 7

#====================#
# Mapping Parameters #
#====================#

Mapping:
  baseline_dist_thr_ratio: 0.02
  redundant_obs_ratio_thr: 0.9
  num_covisibilities_for_landmark_generation: 20
  num_covisibilities_for_landmark_fusion: 20

#===========================#
# PangolinViewer Parameters #
#===========================#

PangolinViewer:
  keyframe_size: 0.05
  keyframe_line_width: 1
  graph_line_width: 1
  point_size: 2
  camera_size: 0.08
  camera_line_width: 3
  viewpoint_x: 0
  viewpoint_y: -0.9
  viewpoint_z: -1.9
  viewpoint_f: 400
