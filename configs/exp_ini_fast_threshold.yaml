# 實驗:ini_fast_threshold 從 20 調大到 100
# 預期:orb_extractor 對每個網格先用 ini_fast_threshold 跑一次 FAST 角點偵測，門檻拉高後，
#       第一輪能通過的強角點變少，更多網格會觸發「補救機制」改用 min_fast_threshold(7)重跑一次；
#       靠補救撿回來的角點響應值(response)偏弱，整體特徵點數量不會差太多(有補救機制保底)，
#       但特徵品質分佈會往弱角點偏移，追蹤穩定度可能因此下降。

# TUM RGBD monocular model for 01

#==============#
# Camera Model #
#==============#

Camera:
  name: "TUM RGBD monocular 01"
  setup: "monocular"
  model: "perspective"

  fx: 517.306408
  fy: 516.469215
  cx: 318.643040
  cy: 255.313989

  k1: 0.262383
  k2: -0.953104
  p1: -0.005358
  p2: 0.002628
  k3: 1.163314

  fps: 30.0
  cols: 640
  rows: 480

  color_order: "RGB"

#=====================#
# Tracking Parameters #
#=====================#

Preprocessing:
  min_size: 800

#================#
# ORB Parameters #
#================#

Feature:
  name: "exp_ini_fast_threshold: ini_fast_threshold 20 -> 100"
  scale_factor: 1.2
  num_levels: 8
  ini_fast_threshold: 100
  min_fast_threshold: 7

#====================#
# Mapping Parameters #
#====================#

Mapping:
  baseline_dist_thr_ratio: 0.02
  redundant_obs_ratio_thr: 0.9
  num_covisibilities_for_landmark_generation: 20
  num_covisibilities_for_landmark_fusion: 20

#===========================#
# PangolinViewer Parameters #
#===========================#

PangolinViewer:
  keyframe_size: 0.05
  keyframe_line_width: 1
  graph_line_width: 1
  point_size: 2
  camera_size: 0.08
  camera_line_width: 3
  viewpoint_x: 0
  viewpoint_y: -0.9
  viewpoint_z: -1.9
  viewpoint_f: 400
