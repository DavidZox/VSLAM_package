# 實驗:num_covisibilities_for_landmark_generation 從 20 調小到 5
# 預期:mapping_module 每插入一個新關鍵幀，會取它的前 N 個共視關鍵幀(看得到同一批地標最多的
#       關鍵幀)，逐一嘗試三角化新地標(create_new_landmarks)。N 從 20 降到 5，代表每次只跟
#       最相鄰的 5 個關鍵幀嘗試配對——BoW/robust matching + 三角化的次數變少，建圖速度變快、
#       CPU 負擔變輕；但可以互相三角化的關鍵幀組合也變少，尤其關鍵幀之間 baseline 較小、
#       需要多組配對才找得到足夠三角化角度的情況下，新地標生成率會下降、地圖點密度變低。

# TUM RGBD monocular model for 01

#==============#
# Camera Model #
#==============#

Camera:
  name: "TUM RGBD monocular 01"
  setup: "monocular"
  model: "perspective"

  fx: 517.306408
  fy: 516.469215
  cx: 318.643040
  cy: 255.313989

  k1: 0.262383
  k2: -0.953104
  p1: -0.005358
  p2: 0.002628
  k3: 1.163314

  fps: 30.0
  cols: 640
  rows: 480

  color_order: "RGB"

#=====================#
# Tracking Parameters #
#=====================#

Preprocessing:
  min_size: 800

#================#
# ORB Parameters #
#================#

Feature:
  name: "exp_num_covis_landmark_generation: num_covisibilities_for_landmark_generation 20 -> 5"
  scale_factor: 1.2
  num_levels: 8
  ini_fast_threshold: 20
  min_fast_threshold: 7

#====================#
# Mapping Parameters #
#====================#

Mapping:
  baseline_dist_thr_ratio: 0.02
  redundant_obs_ratio_thr: 0.9
  num_covisibilities_for_landmark_generation: 5
  num_covisibilities_for_landmark_fusion: 20

#===========================#
# PangolinViewer Parameters #
#===========================#

PangolinViewer:
  keyframe_size: 0.05
  keyframe_line_width: 1
  graph_line_width: 1
  point_size: 2
  camera_size: 0.08
  camera_line_width: 3
  viewpoint_x: 0
  viewpoint_y: -0.9
  viewpoint_z: -1.9
  viewpoint_f: 400
